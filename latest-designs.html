    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <a class="prev" onclick="changeImage(-1)">&#10094;</a>
        <a class="next" onclick="changeImage(1)">&#10095;</a>
    </div>
    <script>
        let currentIndex = 0;
        const images = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");

        // Open lightbox on image click
        images.forEach((img, index) => {
            img.addEventListener("click", () => {
                currentIndex = index;
                showImage();
                lightbox.style.display = "flex";
            });
        });

        function showImage() {
            lightboxImg.src = images[currentIndex].src;
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            showImage();
        }

        function closeLightbox() {
            lightbox.style.display = "none";
        }

        let startX = 0;

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  if (startX - endX > 50) {
    // swipe left
    changeImage(1);
  } else if (endX - startX > 50) {
    // swipe right
    changeImage(-1);
  }
});

const subLinks = document.querySelectorAll(".sub-link");
const contents = document.querySelectorAll(".tab-content");
const dropdown = document.querySelector(".sub-nav-dropdown");

// Handle click for desktop nav
subLinks.forEach(link => {
  link.addEventListener("click", () => {
    subLinks.forEach(l => l.classList.remove("active"));
    contents.forEach(c => c.classList.remove("active"));

    link.classList.add("active");
    document.getElementById(link.dataset.target).classList.add("active");

    // sync dropdown
    dropdown.value = link.dataset.target;
  });
});

// Handle change for mobile dropdown
dropdown.addEventListener("change", () => {
  const target = dropdown.value;

  subLinks.forEach(l => l.classList.remove("active"));
  contents.forEach(c => c.classList.remove("active"));

  document.querySelector(`.sub-link[data-target="${target}"]`).classList.add("active");
  document.getElementById(target).classList.add("active");
});



    </script>
